// 고른 역학의 과목들을 듣는 순서대로 잇기: 카드 사이 여백(세로 통로 · 가로 통로)으로만 다니는 직각 연결선 + 둥근 모서리.
// 선이 다른 과목 카드 위를 지나가지 않고, 출발점은 작은 점, 도착점은 작은 화살촉.
function drawArrows() {
  const grid = document.getElementById('cgrid'), svg = document.getElementById('carrows'); if (!grid || !svg) return;
  const g = svg.querySelector('g'), T = CTRK[CUR_TRK]; g.innerHTML = ''; if (!T) return;
  const G = grid.getBoundingClientRect(), cols = [...grid.querySelectorAll('.cm-col')];
  const C = cols.map(c => { const r = c.getBoundingClientRect(); return [r.left - G.left, r.right - G.left]; });
  const box = n => { const e = grid.querySelector(`.mc[data-n="${n}"]`), r = e.getBoundingClientRect(); return { col: cols.indexOf(e.parentNode), l: r.left - G.left, r: r.right - G.left, t: r.top - G.top, b: r.bottom - G.top, cy: (r.top + r.bottom) / 2 - G.top }; };
  const gapX = (i, f) => i < 0 ? C[0][0] - 9 : C[i][1] + (C[i + 1][0] - C[i][1]) * f;       // i번째 열 오른쪽 여백 안의 세로 통로
  const round = pts => {          // 꺾이는 점마다 둥글게
    let d = `M${pts[0][0]} ${pts[0][1]}`;
    for (let i = 1; i < pts.length - 1; i++) {
      const [x0, y0] = pts[i - 1], [x, y] = pts[i], [x1, y1] = pts[i + 1];
      const r = Math.min(6, Math.hypot(x - x0, y - y0) / 2, Math.hypot(x1 - x, y1 - y) / 2);
      const ax = x - Math.sign(x - x0) * r, ay = y - Math.sign(y - y0) * r, bx = x + Math.sign(x1 - x) * r, by = y + Math.sign(y1 - y) * r;
      d += `L${ax} ${ay}Q${x} ${y} ${bx} ${by}`;
    }
    const e = pts[pts.length - 1]; return d + `L${e[0]} ${e[1]}`;
  };
  let lines = '', heads = '';
  for (let i = 0; i < T.list.length - 1; i++) {
    const A = box(T.list[i]), B = box(T.list[i + 1]), ex = B.l - 8;      // 화살촉 길이만큼 앞에서 선을 끝냄
    let pts;
    if (A.col === B.col) { const x = gapX(A.col - 1, .72), sy = A.b - 13;                       // 같은 학기: 카드 왼쪽 아래에서 나와 왼쪽 통로로 내려감
      pts = [[A.l, sy], [x, sy], [x, B.cy], [ex, B.cy]]; }
    else if (B.col === A.col + 1) { const x = gapX(A.col, .4);                                    // 바로 다음 학기
      pts = Math.abs(A.cy - B.cy) < 1 ? [[A.r, A.cy], [ex, B.cy]] : [[A.r, A.cy], [x, A.cy], [x, B.cy], [ex, B.cy]]; }
    else { const x1 = gapX(A.col, .3), x2 = gapX(B.col - 1, .6), lane = A.cy <= B.cy ? B.t - 4 : B.b + 4;   // 학기를 건너뜀: 도착 과목 바로 위(아래) 가로 통로로
      pts = [[A.r, A.cy], [x1, A.cy], [x1, lane], [x2, lane], [x2, B.cy], [ex, B.cy]]; }
    lines += `<path d="${round(pts)}"/>`;
    heads += `<path d="M${B.l - 2} ${B.cy}l-6.5 -3.8v7.6z"/>`;
  }
  g.innerHTML = `<g class="line">${lines}</g><g class="head">${heads}</g>`;
}

      <p>1999년부터 BK21 과학기술분야 1단계, 2단계 및 4단계 사업에 참여하여 우리나라 기계 분야의 고급인력을 양성하고 있으며, 2003년부터 교육부 학연산 클러스터 교육과정과 연계하여 현장 중심형, 연구 중심형, 창업 중심형 교육과정과 같은 맞춤형 교육프로그램을 제공하고 있습니다. 또한 한국과학재단 지정 최적설계신기술 연구센터와 산업자원부 지원 신뢰성분석 연구센터 및 마이크로바이오칩 센터에 참여하고 국가 창의적 연구 과제를 포함한 각종 국가연구개발과제와 산업체 과제를 수행하고 있습니다.</p>
      <p>특히 2004년 대교협 기계분야 평가에서 전국 2위의 성적으로 최우수 학과로 선정되었으며, 2012년도 한국대학교육협의회 주관 산업계 관점 대학평가 '최우수', 2013년도 중앙일보 학과평가 '전국 10위', QS 세계대학 학문분야 평가 '세계 109위', 2014년 수도권특성화대학 사업단 선정, 2020년 4단계 BK21 교육연구단 선정 등 명실공히 21세기 국가산업을 주도할 기계분야의 연구 및 교육중심 학과로 자리 잡고 있습니다.</p>
      <p>이러한 지금까지의 전통을 이어받아, 앞으로도 우리 학과는 국가의 기술경쟁력을 높이고 인류발전에 기여하며, 세계적 수준의 기계공학 교육을 통해 우수한 공학인재를 양성할 뿐 아니라 글로벌 수준의 기술개발 및 연구를 이어가기 위해 끊임없이 노력할 것입니다.</p>`)}`,

    ['전공학회', `<b>RED (Renovative Engineering Design)</b>기계공학과 전공학회 RED(Renovative Engineering Design)는 기계공학도로서 갖추어야 할 전공 역량을 함양하고, 공학적 지식을 실제 설계 및 제작 과정에 적용하는 능력을 기르는 것을 목적으로 활동하고 있습니다.<span class="cl-para">CATIA, Autodesk Fusion, ANSYS, Arduino 등 다양한 공학 프로그램을 활용한 정규 스터디를 운영하고 있으며, 3D 프린팅 특강, 전공 관련 산업 박람회 견학 등 여러 학술활동을 진행하고 있습니다. 또한, 학회원들이 학습한 내용을 바탕으로 아이디어를 구체화하고 실현할 수 있도록 교내외 공모전 참여를 지원하고 있습니다.</span><span class="cl-trio"><img src="img/red-1.jpg" alt="RED 단체 사진" loading="lazy"><img src="img/red-2.jpg" alt="RED 산업 박람회 견학" loading="lazy"><img src="img/red-3.jpg" alt="RED 정규 스터디" loading="lazy"></span>`]])

// 학년 탭 (내용이 바뀌어도 동작하도록 위임)
document.addEventListener('click', e => { const b = e.target.closest('#mtabs button'); if (b) setTrack(b.dataset.t); });
document.addEventListener('click', e => {
  const b = e.target.closest('#ytabs button'); if (!b) return;
  b.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  document.getElementById('ybody').innerHTML = ugBody(+b.dataset.y);
});

document.addEventListener('click', e => {
  const b = e.target.closest('#gtabs button'); if (!b) return;
  b.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  document.getElementById('gbody').innerHTML = grBody(b.dataset.g);
});

// 전문 보기 + 버튼
document.addEventListener('click', e => {
  const b = e.target.closest('.fold-btn'); if (!b) return;
  const open = b.getAttribute('aria-expanded') !== 'true';
  b.setAttribute('aria-expanded', open); b.closest('.fold').classList.toggle('open', open);
  b.querySelector('span').textContent = b.querySelector('span').textContent.replace(open ? '보기' : '접기', open ? '접기' : '보기');
});

// 장학: 자대생/타대생 선택 → 해당 없는 카드는 흐리게
document.addEventListener('click', e => {
  const b = e.target.closest('#scf button'); if (!b) return;
  b.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('#scg .sc').forEach(c => c.classList.toggle('dim', b.dataset.w === 'other' && c.dataset.other !== '1'));
});

// 장학 카드 + 버튼: 펼치기/접기
document.addEventListener('click', e => {
  const b = e.target.closest('.sc-plus'); if (!b) return;
  const open = b.getAttribute('aria-expanded') !== 'true';
  b.setAttribute('aria-expanded', open); b.closest('.sc').classList.toggle('open', open);
});

// 같은 메뉴 안 탭 이동: 새로고침 없이 내용만 부드럽게 바꿈
function goSub(k, push) {
  if (k === s) return;
  s = k; paintHead();
  if (push) history.pushState({ m, s }, '', subHref(m, s));
  content.classList.add('pg-out');
  setTimeout(() => {
    content.innerHTML = PAGES[`${m}-${s}`] || empty('준비 중인 페이지입니다.');
    content.classList.remove('pg-out'); content.classList.add('pg-in');
    requestAnimationFrame(() => requestAnimationFrame(() => content.classList.remove('pg-in')));
  }, 180);
}
document.getElementById('subtabs').addEventListener('click', e => {
  const a = e.target.closest('a'); if (!a) return;
  const u = new URL(a.href, location.href); if (!/sub\.html$/.test(u.pathname) || +u.searchParams.get('m') !== m) return;
  e.preventDefault(); goSub(+u.searchParams.get('s') || 0, true);
});
addEventListener('popstate', () => { const qq = new URLSearchParams(location.search); if ((+qq.get('m') || 0) === m) goSub(+qq.get('s') || 0, false); else location.reload(); });
