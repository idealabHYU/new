    ${FOLD('학과소개 전문 보기', `
      <p>한양대학교 기계공학과는 1979년 한양대학교 ERICA캠퍼스의 개교와 함께 출범하여 서해안시대를 주도할 전략적 산업 요충지인 전원공업도시 안산에 뿌리를 내려 지난 40여 년간 대한민국 기계공학 분야의 중추적인 역할을 담당하는 훌륭한 고급인력 양성에 주력하여 왔습니다. 본 대학의 '사랑의 실천'이라는 건학 이념을 바탕으로, 지성인으로서의 인격과 품성을 갖추도록 교육하며, 기계공학 분야의 깊이 있는 이론과 기술을 습득하게 하고, 창의력, 해석력, 통합력, 현실구현화 능력을 배양함으로써, 장차 기계공학 분야는 물론 산업기술, 과학 등 관련 어느 분야에서도 충분한 공학적 감각과 독창성을 발휘하여 선도적 역할을 수행하는 탁월한 인재 육성을 목표로 하고 있습니다.</p>
      <p>현재 본 학과 소속 교수진은 전원 국내외의 저명 대학에서 박사학위를 취득한 20여 명으로 구성되어 국내 최고 수준에 있습니다. 젊고 활력 넘치는 교육 및 연구 활동으로, 인근의 안산·시화공단의 산업체뿐만 아니라 서울·경기 지역의 산업체와 효율적인 협력관계를 구축하고 이를 교육과 연계함으로써 이론과 현장실무를 통합한 실용학문의 교육에 매진하고 있습니다. 또한 산학지역 컨소시엄과 안산 테크노파크를 통한 첨단산업기술의 개발·이전으로 지역경제 활성화에 일익을 담당할 전문인력 양성에도 힘쓰고 있습니다.</p>
      <p>교육과정은 1학년에서 기계공학의 기초에 해당하는 응용과학 과목을, 2학년에서 기계시스템의 해석과 이해를 위한 전공기초 과목(고체역학, 열역학, 동역학, 유체역학)을, 3학년에서 기계시스템의 설계와 제작을 위한 전공심화 과목(기계설계, 열전달, 기계제작공정, 기계진동학, 수치계산, 컴퓨터지원설계, 계측시스템 설계및응용, 기계가공실습 등)을, 4학년에서 전공응용 과목(열시스템설계, 탄성학설계, 유체기계설계, 동력기계설계, 자동제어, 기계역학 등)을 교육합니다. 이론 학습과 함께 CAE S/W(CATIA, ANSYS, FLUENT)를 포함한 실험실습 교육을 병행하여 4차 산업기술 및 국가 발전에 기여하는 인력을 양성하고, 산업체, 정부기관, 연구기관, 학계에서 지도적인 역할을 담당하여 국가와 인류사회 번영에 이바지하고자 합니다.</p>
      <p>대학원 과정으로 기계설계공학과를 운영하며 석사 및 박사 학위 프로그램을 제공합니다. 기계공학 또는 관련 분야의 학사학위를 가진 자에게 입학자격이 부여되며, 자동화·정밀화·고기능화되어 가는 기계류를 보다 안전하고 경제적이며 효율적으로 설계·제작·운전할 수 있도록 최신 이론과 응용기법을 심도 있게 교육·연구하여, 해석력과 창의력 및 종합적인 이해력을 겸비한 정예의 석박사 연구기술자 양성을 목표로 합니다.</p>
      <p>학부생 동아리로는 자동차 차체·차량을 제작해 자동차 경주대회에 출전하여 전국대회 2위, 국제대회 입상 등의 성과를 보이고 있는 자동차연구회 '바쿠넷(BAQU4)', 기계공학 관련 CAE 및 컴퓨터 프로그래밍 동아리 'RED', 축구 동아리 '동틀무렵'이 활발하게 활동하고 있습니다.</p>`)}`,

      <p>1979년 한양대학교 ERICA캠퍼스와 함께 시작된 공학대학 기계공학과는 세계 수준의 현장맞춤형 교육시스템 확립을 통한 기계 산업 발전을 선도하는 실용 / 창의 / 전문 / 융합형 글로벌 기계인력 배출을 목표로, 지금까지 약 6,500여 명의 졸업생을 배출하여 국내 대기업 및 중소기업, 연구소, 대학, 공공기관 등 우리 사회 각계각층뿐 아니라 해외에서도 활발하게 활약하고 있습니다.</p>
      <p>1999년부터 BK21 과학기술분야 1단계, 2단계 및 4단계 사업에 참여하여 우리나라 기계 분야의 고급인력을 양성하고 있으며, 2003년부터 교육부 학연산 클러스터 교육과정과 연계하여 현장 중심형, 연구 중심형, 창업 중심형 교육과정과 같은 맞춤형 교육프로그램을 제공하고 있습니다. 또한 한국과학재단 지정 최적설계신기술 연구센터와 산업자원부 지원 신뢰성분석 연구센터 및 마이크로바이오칩 센터에 참여하고 국가 창의적 연구 과제를 포함한 각종 국가연구개발과제와 산업체 과제를 수행하고 있습니다.</p>

const content = document.getElementById('content');
content.innerHTML = PAGES[`${m}-${s}`] || empty('준비 중인 페이지입니다.');

// 학년 탭 (내용이 바뀌어도 동작하도록 위임)
document.addEventListener('click', e => {
  const b = e.target.closest('#ytabs button'); if (!b) return;
  b.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  document.getElementById('ybody').innerHTML = ugBody(+b.dataset.y);
});

document.addEventListener('click', e => {
  const b = e.target.closest('#gtabs button'); if (!b) return;
  b.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  document.getElementById('gbody').innerHTML = grBody(b.dataset.g);
});

// 전문 보기 + 버튼
document.addEventListener('click', e => {
  const b = e.target.closest('.fold-btn'); if (!b) return;
  const open = b.getAttribute('aria-expanded') !== 'true';
  b.setAttribute('aria-expanded', open); b.closest('.fold').classList.toggle('open', open);
  b.querySelector('span').textContent = b.querySelector('span').textContent.replace(open ? '보기' : '접기', open ? '접기' : '보기');
});

// 장학: 자대생/타대생 선택 → 해당 없는 카드는 흐리게
document.addEventListener('click', e => {
  const b = e.target.closest('#scf button'); if (!b) return;
  b.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('#scg .sc').forEach(c => c.classList.toggle('dim', b.dataset.w === 'other' && c.dataset.other !== '1'));
});

// 장학 카드 + 버튼: 펼치기/접기
document.addEventListener('click', e => {
  const b = e.target.closest('.sc-plus'); if (!b) return;
  const open = b.getAttribute('aria-expanded') !== 'true';
  b.setAttribute('aria-expanded', open); b.closest('.sc').classList.toggle('open', open);
});

// 같은 메뉴 안 탭 이동: 새로고침 없이 내용만 부드럽게 바꿈
function goSub(k, push) {
  if (k === s) return;
  s = k; paintHead();
  if (push) history.pushState({ m, s }, '', subHref(m, s));
  content.classList.add('pg-out');
  setTimeout(() => {
    content.innerHTML = PAGES[`${m}-${s}`] || empty('준비 중인 페이지입니다.');
    content.classList.remove('pg-out'); content.classList.add('pg-in');
    requestAnimationFrame(() => requestAnimationFrame(() => content.classList.remove('pg-in')));
  }, 180);
}
document.getElementById('subtabs').addEventListener('click', e => {
  const a = e.target.closest('a'); if (!a) return;
  const u = new URL(a.href, location.href); if (!/sub\.html$/.test(u.pathname) || +u.searchParams.get('m') !== m) return;
  e.preventDefault(); goSub(+u.searchParams.get('s') || 0, true);
});
addEventListener('popstate', () => { const qq = new URLSearchParams(location.search); if ((+qq.get('m') || 0) === m) goSub(+qq.get('s') || 0, false); else location.reload(); });
